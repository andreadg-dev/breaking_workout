<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&amp;family=Montserrat:wght@100;300;400;600&amp;family=Roboto:wght@100;300;500;700&amp;family=Rubik:wght@300;400;500;700&amp;family=Ubuntu:wght@300;400;500;700&amp;family=Fira+Code:wght@300..700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>BreakingCardio</title>
  </head>
  <body>
    <div id="root">
      <div id="workout_settings"></div>
      <div id="moves_selection"></div>
      <div id="form_buttons"></div>
    </div>

    <footer>
      <div id="paddingCopyright"></div>
      <div id="copyright">
        <a href="https://github.com/andreadg-dev">@andreadg-dev</a>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.7.1.min.js"></script>
    <script src="components.js"></script>
    <script src="index.js"></script>
    <script>
      window.onload = (event) => {
        setCopyright();
        getMovesSelectionScreen();
        enableDraggableBehaviour();

        $(document).on("change", ".move_dropdown", function () {
          updateSelectionStyling(this);
          updateWorkoutSettings(calculateTotalExerciseCount());
        });
      };
    </script>
  </body>
</html>
